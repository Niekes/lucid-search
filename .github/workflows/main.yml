name: CI

on:
    - pull_request
    - push

# Read-only by default; the badges job asks for write access itself.
permissions:
    contents: read

jobs:
    verify:
        name: Verify (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v7
              with:
                  # Fallow resolves its rules against the changed files, so the history has to be there.
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Typecheck, format, lint, tests with 100% coverage, fallow, build and docs build.
            - run: pnpm verify
              env:
                  FALLOW_FORMAT: github-annotations

    badges:
        name: Update badges
        needs: verify
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Update the health and coverage badges
              run: |
                  pnpm exec fallow health --format badge > .github/badges/health.svg
                  pnpm coverage
                  # A shields.io endpoint badge, read by the README.
                  node -e "const p = require('./coverage/coverage-summary.json').total.lines.pct; console.log(JSON.stringify({ schemaVersion: 1, label: 'coverage', message: p + '%', color: p >= 90 ? 'brightgreen' : p >= 75 ? 'yellow' : 'red' }))" > .github/badges/coverage.json
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add .github/badges/health.svg .github/badges/coverage.json
                  git diff --quiet --cached || git commit -m "chore: update the health and coverage badges [skip ci]"
                  git push

name: CI

on:
    - pull_request
    - push

jobs:
    verify:
        name: Verify (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v7
              with:
                  # Fallow resolves its rules against the changed files, so the history has to be there.
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Typecheck, format, lint, tests with 100% coverage, fallow, build and docs build.
            - run: pnpm verify
              env:
                  FALLOW_FORMAT: github-annotations
